<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dziękuję | DJ HuNi</title>

    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#090909">

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090909;
            color: #fff;
            font-family: "Poppins", sans-serif;
            padding: 25px;
            text-align: center;
        }

        .thanks {
            max-width: 650px;
        }

        .thanks img {
            width: 150px;
            max-width: 60%;
            margin-bottom: 35px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border: 2px solid #c9a44c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9a44c;
            font-size: 34px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 50px);
            margin-bottom: 15px;
        }

        p {
            color: #bbb;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        a {
            display: inline-block;
            padding: 14px 30px;
            background: #c9a44c;
            color: #090909;
            text-decoration: none;
            font-weight: 600;
            border-radius: 6px;
            transition: .25s;
        }

        a:hover {
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

    <main class="thanks">

        <img src="logo.png" alt="DJ HuNi">

        <div class="icon">✓</div>

        <h1>Dziękuję!</h1>

        <p>
            Wiadomość została wysłana.<br>
            Odezwę się wkrótce.
        </p>

        <a href="/">
            Wróć na stronę główną
        </a>

    </main>

</body>

</html>
